[project]
name = "hallucinations-math-lab"
version = "0.1.0"
description = "Response evaluators for LLM-native projects: Semantic Entropy, predictive entropy, Semantic Entropy Probes, plus optional LLM-as-a-judge escalation. Shippable as a library (import name: hallucinations_math_lab), with a reference vLLM-on-Vertex demo."
readme = "README.md"
authors = [
    { name = "Elad Laor", email = "eladlaor88@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"

# Core: the Semantic-Entropy detection path that the library exposes by default.
# torch + transformers are required because hallucinations_math_lab/__init__ eagerly imports the
# DeBERTa-MNLI NLI detector. Everything provider/judge/demo/eval specific is an
# optional extra below.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "torch>=2.3",
    "transformers>=4.56",
    "numpy>=1.26",
    # SEP datasets and probes store tensors as safetensors, which cannot carry code.
    "safetensors>=0.4",
    # SEP_PROBE_PATH=hf://... downloads a probe directory from the Hub.
    "huggingface-hub>=1.0",
]

[project.optional-dependencies]
# Reference vLLM / OpenAI-compatible sampling provider plus the demo CLI.
demo = [
    # Callable api_key (refreshing Google access tokens); tested on 3.x.
    "openai>=3.0",
    "google-auth>=2.30",
    # HFTransformersProvider loads with device_map="auto", which needs accelerate.
    "accelerate>=1.0",
    "tenacity>=8.5",
    "typer>=0.12",
    "rich>=13.7",
]
# Vertex AI Gemini judge (escalation path), via the Google Gen AI SDK.
judge = [
    "google-genai>=1.0",
]
# Uploading and deploying the serving image to Vertex AI (serving/vertex_deploy.py,
# run by Terraform). 2.5+ is the verified version with invoke-route support.
deploy = [
    "google-cloud-aiplatform>=2.5",
]
# Eval / benchmarking harness (eval/*.py, not shipped in the wheel).
eval = [
    "datasets>=2.20",
    # The SEP dataset's rows.parquet.
    "pyarrow>=15",
    "scikit-learn>=1.8",
    "scipy>=1.13",
]
# Local web playground (demo/web): the API and the committed, prebuilt UI.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
all = [
    "hallucinations-math-lab[demo,judge,eval,deploy,web]",
]
dev = [
    "pytest>=8.2",
    # The auth contract test drives the real OpenAI client over httpx2.
    "httpx2",
    "pytest-asyncio>=0.23",
    "ruff>=0.17",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.mypy]
python_version = "3.12"
files = ["src", "demo", "examples", "eval", "tests", "serving"]
explicit_package_bases = true
mypy_path = ["src", ".", "examples"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# scikit-learn, scipy, datasets and pyarrow ship no complete type information.
module = [
    "sklearn", "sklearn.*", "scipy", "scipy.*", "datasets", "datasets.*", "pyarrow", "pyarrow.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The public API list is grouped by role (entry points, protocols, detectors,
# ...) with comments; alphabetical sorting would scatter the groups.
"src/hallucinations_math_lab/__init__.py" = ["RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Make both the src-layout library (hallucinations_math_lab) and the demo/ top-level package
# importable in tests without installing demo as a distribution.
pythonpath = ["src", "."]
markers = [
    "requires_gpu: skipped by default; runs only when a CUDA-capable device is present.",
]
