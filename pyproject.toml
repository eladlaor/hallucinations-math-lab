[project]
name = "seh-handler"
version = "0.1.0"
description = "Semantic-Entropy-based hallucination detector and judge-escalation pipeline for a quantized Gemma served via vLLM on Vertex AI, orchestrated with Google ADK."
readme = "README.md"
authors = [
    { name = "Elad Laor", email = "eladlaor88@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "transformers>=4.44",
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "datasets>=2.20",
    "scikit-learn>=1.5",
    "google-cloud-aiplatform>=1.71",
    "google-adk>=2.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ui = ["gradio>=4.40"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
seh = "seh_handler.main:app"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
