# Cloud Build config for the vLLM serving image. The source upload is the
# repo root (so `COPY demo/...` in serving/Dockerfile resolves), and the
# Dockerfile path is named explicitly. The image URI is passed via the
# _IMAGE_URI substitution from the caller, e.g.:
#
#   gcloud builds submit . --config=serving/cloudbuild.yaml \
#       --substitutions="_IMAGE_URI=<region>-docker.pkg.dev/<proj>/<repo>/<img>:<tag>"
#
# The image URI then becomes the value of `vllm_image_uri` in Terraform.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=serving/Dockerfile
      - --tag=${_IMAGE_URI}
      - .

images:
  - ${_IMAGE_URI}

options:
  machineType: E2_HIGHCPU_8
