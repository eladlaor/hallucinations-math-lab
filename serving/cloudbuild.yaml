# Cloud Build config used by serving/deploy_vertex.sh. The source upload is
# the repo root (so COPY src/... in serving/Dockerfile resolves), and the
# Dockerfile path is named explicitly. The image URI is passed via the
# _IMAGE_URI substitution from the deploy script.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=serving/Dockerfile
      - --tag=${_IMAGE_URI}
      - .

images:
  - ${_IMAGE_URI}

options:
  machineType: E2_HIGHCPU_8
